name: Pinned Payload Website build

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/payload-website-build.yml
      - ci/payload-*
      - src/payload-template.js
      - sources/payload-website.lock.json

permissions:
  contents: read

jobs:
  website-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PAYLOAD_SECRET: ci-only-not-for-production-32-character-secret
      DATABASE_URL: mongodb://127.0.0.1:27017/sitepilot_payload_ci
      NEXT_PUBLIC_SERVER_URL: http://127.0.0.1:3000
      NEXT_TELEMETRY_DISABLED: "1"
      CI: "1"
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - name: Read fixed source lock
        id: source
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const lock = JSON.parse(fs.readFileSync("sources/payload-website.lock.json", "utf8"));
            if (lock.repositoryUrl !== "https://github.com/payloadcms/payload.git" || !/^[0-9a-f]{40}$/.test(lock.commit)) throw new Error("Unexpected Payload source lock");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `commit=${lock.commit}\n`);
          '
      - name: Fetch fixed Payload source with sparse checkout
        run: |
          git init --quiet payload-source
          git -C payload-source remote add origin https://github.com/payloadcms/payload.git
          git -C payload-source -c protocol.version=2 fetch --quiet --no-tags --depth=1 --filter=blob:none origin "${{ steps.source.outputs.commit }}"
          git -C payload-source sparse-checkout init --no-cone
          git -C payload-source sparse-checkout set --no-cone -- templates/website packages LICENSE.md package.json pnpm-workspace.yaml pnpm-lock.yaml .node-version .nvmrc tsconfig.json
          git -C payload-source checkout --quiet --detach "${{ steps.source.outputs.commit }}"
          test "$(git -C payload-source rev-parse HEAD)" = "${{ steps.source.outputs.commit }}"
          test -f payload-source/templates/website/package.json
      - name: Verify fixed template manifest
        run: |
          node --input-type=module -e '
            import lock from "./sources/payload-website.lock.json" with { type: "json" };
            import { TemplateSnapshotVerifier } from "./src/template-verifier.js";
            const result = await new TemplateSnapshotVerifier({ lock, root: `${process.cwd()}/payload-source` }).verify();
            console.log(`Payload ${result.commit}, template manifest ${result.manifestHash}`);
          '
      - name: Install frozen website workspace dependencies
        working-directory: payload-source
        run: |
          corepack enable
          corepack pnpm --version
          corepack pnpm install --filter website... --filter . --frozen-lockfile --ignore-scripts
      - name: Build website workspace runtime dependencies
        working-directory: payload-source
        run: |
          set +e
          corepack pnpm -r --filter 'website^...' --if-present run build:swc > dependency-build.log 2>&1
          result=$?
          tail -n 100 dependency-build.log
          if [ "$result" -ne 0 ]; then
            while IFS= read -r line; do
              case "$line" in
                *error*|*Error*|*failed*|*Failed*)
                  line=${line//%/%25}
                  line=${line//$'\r'/%0D}
                  line=${line//$'\n'/%0A}
                  echo "::error title=Payload dependency build::$line"
                  ;;
              esac
            done < <(tail -n 30 dependency-build.log)
          fi
          exit "$result"
      - name: Build Payload Website Template
        working-directory: payload-source
        run: |
          set +e
          test -f templates/website/src/providers/HeaderTheme/index.tsx
          node --input-type=module -e '
            import fs from "node:fs";
            const file = "templates/website/tsconfig.json";
            const config = JSON.parse(fs.readFileSync(file, "utf8"));
            if (config.compilerOptions?.paths?.["@/*"]?.[0] !== "./src/*") throw new Error("Unexpected Website path alias");
            config.compilerOptions.baseUrl = ".";
            fs.writeFileSync(file, `${JSON.stringify(config, null, 2)}\n`);
            const nextConfig = "templates/website/next.config.ts";
            let source = fs.readFileSync(nextConfig, "utf8");
            const marker = "webpackConfig.resolve.extensionAlias = {";
            if (!source.includes(marker)) throw new Error("Unexpected Website webpack config");
            source = source.replace(marker, `webpackConfig.resolve.alias = { ...(webpackConfig.resolve.alias || {}), "@": path.resolve(dirname, "src"), "@payload-config": path.resolve(dirname, "src/payload.config.ts") };\n    ${marker}`);
            fs.writeFileSync(nextConfig, source);
          '
          git diff -- templates/website/tsconfig.json
          test -f node_modules/typescript/package.json
          test ! -e templates/website/node_modules/typescript
          ln -s ../../../node_modules/typescript templates/website/node_modules/typescript
          corepack pnpm --filter website exec node -e 'console.log(require.resolve("next/package.json"))'
          corepack pnpm --filter website exec node -e 'const fs = require("node:fs"); const path = require("node:path"); for (const [name, file] of [["typescript", "lib/typescript.js"], ["@types/react", "index.d.ts"], ["@types/node", "index.d.ts"]]) { try { const location = path.join(path.dirname(require.resolve(`${name}/package.json`)), file); console.log(`::notice title=Website dependency resolution::${name} ${location} exists=${fs.existsSync(location)}`) } catch (error) { console.log(`::error title=Website dependency resolution::${name} ${error.code}`) } }'
          corepack pnpm --filter website exec node -e 'const { hasNecessaryDependencies } = require("next/dist/lib/has-necessary-dependencies"); const packages = [{pkg:"typescript",file:"typescript/lib/typescript.js",exportsRestrict:true},{pkg:"@types/react",file:"@types/react/index.d.ts",exportsRestrict:true},{pkg:"@types/node",file:"@types/node/index.d.ts",exportsRestrict:true}]; const result=hasNecessaryDependencies(process.cwd(),packages); console.log(`::notice title=Next dependency check::missing=${JSON.stringify(result.missing)} resolved=${JSON.stringify([...result.resolved])}`)'
          corepack pnpm --filter website exec next build --webpack --experimental-build-mode compile > build-output.log 2>&1
          result=$?
          tail -n 100 build-output.log
          if [ "$result" -ne 0 ]; then
            node --input-type=module -e '
              import fs from "node:fs";
              const log = fs.readFileSync("build-output.log", "utf8").replace(/\x1b\[[0-9;]*m/g, "");
              const excerpt = log.split("\n").slice(-100).join("\n").slice(-12000);
              const escaped = excerpt.replaceAll("%", "%25").replaceAll("\r", "%0D").replaceAll("\n", "%0A");
              console.log(`::error title=Payload Website compiler output::${escaped}`);
            '
          fi
          exit "$result"
      - name: Create synthetic draft with SitePilot planner
        run: |
          node ci/payload-fixture.mjs
          cp ci-results/draft-plan.json payload-source/templates/website/sitepilot-draft-plan.json
          cp ci/payload-seed.ts payload-source/templates/website/sitepilot-seed.ts
          cp ci/payload-preview.ts payload-source/templates/website/sitepilot-preview.ts
          cp ci/payload-command.mjs payload-source/templates/website/sitepilot-command.mjs
          password=$(openssl rand -hex 24)
          preview_secret=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          echo "::add-mask::$preview_secret"
          echo "SITEPILOT_CI_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "PREVIEW_SECRET=$preview_secret" >> "$GITHUB_ENV"
      - name: Persist and verify real Payload CMS draft
        working-directory: payload-source/templates/website
        run: node sitepilot-command.mjs corepack pnpm exec tsx sitepilot-seed.ts
      - name: Install Chromium for real preview acceptance
        working-directory: payload-source/templates/website
        run: corepack pnpm exec playwright install --with-deps chromium
      - name: Start website and verify authenticated draft preview
        working-directory: payload-source/templates/website
        timeout-minutes: 8
        run: |
          corepack pnpm exec next start --hostname 127.0.0.1 > sitepilot-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:3000/api/users/me > /dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              tail -n 80 sitepilot-server.log
              exit 1
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            tail -n 80 sitepilot-server.log
            exit 1
          fi
          node sitepilot-command.mjs corepack pnpm exec tsx sitepilot-preview.ts
      - name: Upload synthetic draft acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: payload-draft-acceptance-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ci-results/draft-plan.json
            payload-source/templates/website/sitepilot-cms-receipt.json
            payload-source/templates/website/sitepilot-preview-report.json
            payload-source/templates/website/sitepilot-desktop.png
            payload-source/templates/website/sitepilot-mobile.png
