name: Pinned Payload Website build

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/payload-website-build.yml

permissions:
  contents: read

jobs:
  website-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PAYLOAD_SECRET: ci-only-not-for-production-32-character-secret
      DATABASE_URI: mongodb://127.0.0.1:27017/sitepilot_payload_ci
      NEXT_TELEMETRY_DISABLED: "1"
      CI: "1"
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - name: Read fixed source lock
        id: source
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const lock = JSON.parse(fs.readFileSync("sources/payload-website.lock.json", "utf8"));
            if (lock.repositoryUrl !== "https://github.com/payloadcms/payload.git" || !/^[0-9a-f]{40}$/.test(lock.commit)) throw new Error("Unexpected Payload source lock");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `commit=${lock.commit}\n`);
          '
      - name: Fetch fixed Payload source with sparse checkout
        run: |
          git init --quiet payload-source
          git -C payload-source remote add origin https://github.com/payloadcms/payload.git
          git -C payload-source -c protocol.version=2 fetch --quiet --no-tags --depth=1 --filter=blob:none origin "${{ steps.source.outputs.commit }}"
          git -C payload-source sparse-checkout init --no-cone
          git -C payload-source sparse-checkout set --no-cone -- templates/website packages LICENSE.md package.json pnpm-workspace.yaml pnpm-lock.yaml .node-version .nvmrc tsconfig.json
          git -C payload-source checkout --quiet --detach "${{ steps.source.outputs.commit }}"
          test "$(git -C payload-source rev-parse HEAD)" = "${{ steps.source.outputs.commit }}"
          test -f payload-source/templates/website/package.json
      - name: Verify fixed template manifest
        run: |
          node --input-type=module -e '
            import lock from "./sources/payload-website.lock.json" with { type: "json" };
            import { TemplateSnapshotVerifier } from "./src/template-verifier.js";
            const result = await new TemplateSnapshotVerifier({ lock, root: `${process.cwd()}/payload-source` }).verify();
            console.log(`Payload ${result.commit}, template manifest ${result.manifestHash}`);
          '
      - name: Install frozen website workspace dependencies
        working-directory: payload-source
        run: |
          corepack enable
          corepack pnpm --version
          corepack pnpm install --filter website... --frozen-lockfile --ignore-scripts
      - name: Build website workspace runtime dependencies
        working-directory: payload-source
        run: |
          set +e
          corepack pnpm -r --filter 'website^...' --if-present run build:swc > dependency-build.log 2>&1
          result=$?
          tail -n 100 dependency-build.log
          if [ "$result" -ne 0 ]; then
            while IFS= read -r line; do
              case "$line" in
                *error*|*Error*|*failed*|*Failed*)
                  line=${line//%/%25}
                  line=${line//$'\r'/%0D}
                  line=${line//$'\n'/%0A}
                  echo "::error title=Payload dependency build::$line"
                  ;;
              esac
            done < <(tail -n 30 dependency-build.log)
          fi
          exit "$result"
      - name: Build Payload Website Template
        working-directory: payload-source
        run: |
          set +e
          test -f templates/website/src/providers/HeaderTheme/index.tsx
          node --input-type=module -e '
            import fs from "node:fs";
            const file = "templates/website/tsconfig.json";
            const config = JSON.parse(fs.readFileSync(file, "utf8"));
            if (config.compilerOptions?.paths?.["@/*"]?.[0] !== "./src/*") throw new Error("Unexpected Website path alias");
            config.compilerOptions.baseUrl = ".";
            fs.writeFileSync(file, `${JSON.stringify(config, null, 2)}\n`);
            const nextConfig = "templates/website/next.config.ts";
            let source = fs.readFileSync(nextConfig, "utf8");
            const marker = "webpackConfig.resolve.extensionAlias = {";
            if (!source.includes(marker)) throw new Error("Unexpected Website webpack config");
            source = source.replace(marker, `webpackConfig.resolve.alias = { ...(webpackConfig.resolve.alias || {}), "@": path.resolve(dirname, "src") };\n    ${marker}`);
            fs.writeFileSync(nextConfig, source);
          '
          git diff -- templates/website/tsconfig.json
          corepack pnpm --filter website exec node -e 'console.log(require.resolve("next/package.json"))'
          corepack pnpm --filter website exec next build --webpack > build-output.log 2>&1
          result=$?
          tail -n 100 build-output.log
          if [ "$result" -ne 0 ]; then
            node --input-type=module -e '
              import fs from "node:fs";
              const log = fs.readFileSync("build-output.log", "utf8").replace(/\x1b\[[0-9;]*m/g, "");
              const excerpt = log.split("\n").slice(-100).join("\n").slice(-12000);
              const escaped = excerpt.replaceAll("%", "%25").replaceAll("\r", "%0D").replaceAll("\n", "%0A");
              console.log(`::error title=Payload Website compiler output::${escaped}`);
            '
          fi
          exit "$result"
