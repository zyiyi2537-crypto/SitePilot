<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SitePilot Studio</title><link rel="stylesheet" href="/studio.css"><script src="/studio.js" defer></script></head><body><header><strong>SitePilot</strong><span>Studio</span><small id="connection-status">未连接</small></header><div class="workspace"><aside><h2>项目 <button id="refresh" type="button">刷新</button></h2><nav id="project-list" aria-label="项目列表"></nav></aside><main><div class="heading"><div><small>WORKSPACE</small><h1>项目工作台</h1></div><div class="tabs" role="tablist"><button id="tab-client" role="tab" aria-selected="true" type="button">客户流程</button><button id="tab-review" role="tab" aria-selected="false" type="button">审核队列</button></div></div><section class="credentials"><label>API 凭据<input id="api-token" type="password" autocomplete="off"></label><label id="review-token-field" hidden>审核凭据<input id="review-token" type="password" autocomplete="off"></label><button id="connect" type="button">连接</button></section><p id="notice" role="status" aria-live="polite"></p><div id="client-view"><div class="columns"><section><h2>新项目</h2><form id="project-form"><label>网站目标<textarea name="goal" required rows="3" placeholder="例如：面向海外采购商的工业设备官网"></textarea></label><div class="form-row"><label>行业<select name="industry"><option value="general">通用</option><option value="industrial">工业制造</option><option value="saas">SaaS</option></select></label><label>目标受众<input name="audience" placeholder="采购经理、工程师"></label></div><label>主要转化目标<input name="primaryConversion" placeholder="询盘、预约演示"></label><label>已有资料<input name="contentAvailable" placeholder="产品说明、品牌资料"></label><button class="primary" type="submit">创建项目并生成策略</button></form></section><section><h2>当前运行</h2><div id="run-detail" class="muted">选择一个项目查看策略与待补资料。</div></section></div><section class="research"><h2>组件检索与页面计划</h2><p id="research-status" class="muted">先创建项目与 Run。</p><form id="research-form" class="inline-form"><label>CodeAtlas 仓库 ID<input name="repository" required placeholder="startup-nextjs"></label><label>固定提交 SHA<input name="expectedCommit" required minlength="40" maxlength="40" pattern="[a-fA-F0-9]{40}" placeholder="40 位提交 SHA"></label><button type="submit">检索组件</button></form><button id="create-plan" type="button">生成页面计划</button><pre id="plan-output" hidden></pre></section></div><div id="review-view" hidden><div class="columns"><section><h2>待审核组件</h2><div id="components" class="review-list"></div></section><section><h2>候选交付</h2><div id="candidates" class="review-list"></div></section></div></div></main></div></body></html>
