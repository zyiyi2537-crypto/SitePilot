services:
  sitepilot:
    build:
      context: .
      args:
        NODE_IMAGE: ${SITEPILOT_NODE_IMAGE:-node:24-alpine}
    env_file:
      - ./ops/sitepilot.env
    environment:
      PORT: "3100"
      SITEPILOT_HOST: "0.0.0.0"
      SITEPILOT_DB_FILE: /var/lib/sitepilot/sitepilot.sqlite
      SITEPILOT_WORKTREE_ROOT: /var/lib/sitepilot-worktrees
      SITEPILOT_QUARANTINE_ROOT: /var/lib/sitepilot-quarantine
    ports:
      - "127.0.0.1:${SITEPILOT_PUBLISH_PORT:-3100}:3100"
    volumes:
      - sitepilot-state:/var/lib/sitepilot
      - sitepilot-worktrees:/var/lib/sitepilot-worktrees
      - sitepilot-quarantine:/var/lib/sitepilot-quarantine
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 384m
    pids_limit: 64
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  sitepilot-state:
  sitepilot-worktrees:
  sitepilot-quarantine:
